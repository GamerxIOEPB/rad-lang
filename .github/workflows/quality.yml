name: Rad Quality & Memory Safety

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Compiler, library, and memory-safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build and memory tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm-dev lld valgrind

      - name: Install bootstrap Rad toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/GamerxIOEPB/rad-lang/main/install.sh | sh -s -- -y
          echo "$HOME/.rad/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.rad/lib/llvm:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Build self-hosted compiler
        run: |
          make radc \
            RADC="$HOME/.rad/bin/radc" \
            PREFIX="$HOME/.rad" \
            LLVM_CXXFLAGS="$(llvm-config --cxxflags)" \
            LLVM_LDFLAGS="$(llvm-config --ldflags)"

      - name: Run regression and quality suites
        env:
          REQUIRE_VALGRIND: "1"
        run: |
          make test \
            RADC="$HOME/.rad/bin/radc" \
            PREFIX="$HOME/.rad" \
            LLVM_CXXFLAGS="$(llvm-config --cxxflags)" \
            LLVM_LDFLAGS="$(llvm-config --ldflags)"
