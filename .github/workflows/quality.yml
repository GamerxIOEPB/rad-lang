name: Rad Quality & Memory Safety

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Compiler, library, and memory-safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build and memory tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm-dev lld liblld-21-dev valgrind

      - name: Extract bootstrap Rad toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.rad" /tmp/rad-bootstrap
          (gh release download --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/rad-bootstrap || \
           gh release download 0.2.4 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/rad-bootstrap || \
           gh release download 0.2.3 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/rad-bootstrap) || true
          ARCHIVE="$(find /tmp/rad-bootstrap -maxdepth 1 -type f -name 'rad-*.tar.xz' | head -n 1)"
          if [ -z "$ARCHIVE" ]; then
            echo "error: unable to download a bootstrap Rad release archive" >&2
            exit 1
          fi
          tar -xf "$ARCHIVE" -C "$HOME/.rad" --strip-components=1
          cp -rf lib/rad "$HOME/.rad/lib/"
          echo "$HOME/.rad/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.rad/lib/llvm:$(llvm-config --libdir):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Build self-hosted compiler
        run: |
          make radc \
            RADC="$HOME/.rad/bin/radc" \
            PREFIX="$HOME/.rad" \
            LLVM_CXXFLAGS="$(llvm-config --cxxflags)" \
            LLVM_LDFLAGS="$(llvm-config --ldflags)"

      - name: Run regression and quality suites
        env:
          REQUIRE_VALGRIND: "1"
        run: |
          make test \
            PREFIX="$HOME/.rad" \
            LLVM_CXXFLAGS="$(llvm-config --cxxflags)" \
            LLVM_LDFLAGS="$(llvm-config --ldflags)"

      - name: Upload regression and quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rad-quality-diagnostics
          path: |
            tests/radtest/results/
            tests/radtest/build/
          if-no-files-found: warn
          retention-days: 14
