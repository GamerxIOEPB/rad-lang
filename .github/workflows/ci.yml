name: Build, Test & Release Toolchain

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '[0-9]+.[0-9]+.[0-9]+*' ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Git Tag (default: 0.2.5)'
        required: false
        default: '0.2.5'
      title:
        description: 'Release Title'
        required: false
        default: 'Rad v0.2.5 — Type Aliases, Function Pointers, Match Expressions, Tuples & Static SQLite'
      notes:
        description: 'Release Notes / Description'
        required: false
        default: 'Rad v0.2.5: Comprehensive release introducing Type Aliases (type Alias = TargetType;) unlocking core/ffi, First-Class Function Pointers (fn(...) -> Ret) and FP combinators on Option, Result, and Vec, Match Expression Ergonomics and First-Class Tuple Types with pattern destructuring, static vendored SQLite3 engine with zero test skips, pure-Rad package registry CI & integrity validation, and 100% test pass rate across compiler, stdlib, memory safety, and ecosystem suites.'

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, Quality & Memory Safety Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Native Build & Memory Diagnostics Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm-dev lld liblld-21-dev valgrind

      - name: Extract Bootstrap Rad Toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.rad" /tmp/rad-bootstrap
          (gh release download 0.2.5 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/rad-bootstrap || \
           gh release download 0.2.4 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/rad-bootstrap || \
           gh release download 0.2.3 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/rad-bootstrap || \
           gh release download --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/rad-bootstrap) || true
          ARCHIVE="$(find /tmp/rad-bootstrap -maxdepth 1 -type f -name 'rad-*.tar.xz' | head -n 1)"
          if [ -z "$ARCHIVE" ]; then
            echo "error: unable to download a bootstrap Rad release archive" >&2
            exit 1
          fi
          tar -xf "$ARCHIVE" -C "$HOME/.rad" --strip-components=1
          cp -rf lib/rad "$HOME/.rad/lib/"
          echo "$HOME/.rad/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.rad/lib/llvm:$(llvm-config --libdir):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Build Self-Hosted Compiler
        run: |
          make radc \
            RADC="$HOME/.rad/bin/radc" \
            PREFIX="$HOME/.rad" \
            LLVM_CXXFLAGS="$(llvm-config --cxxflags)" \
            LLVM_LDFLAGS="$(llvm-config --ldflags)"

      - name: Run Regression & Quality Test Suites
        env:
          REQUIRE_VALGRIND: "1"
        run: |
          make test \
            PREFIX="$HOME/.rad" \
            LLVM_CXXFLAGS="$(llvm-config --cxxflags)" \
            LLVM_LDFLAGS="$(llvm-config --ldflags)"

      - name: Run Grammar & AST Fuzzer Stress Suite
        run: |
          python3 tests/fuzzer/grammar_fuzzer.py 200

      - name: Run Standalone Memory Safety & Pointer Stress Suite
        run: |
          ./bin/radc -g tests/quality/memory_safety.rad -o /tmp/mem_safety
          valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all --track-origins=yes /tmp/mem_safety
          rm -f /tmp/mem_safety

      - name: Verify Stage-2 vs Stage-3 Self-Hosting Determinism
        run: |
          make self-host-check

      - name: Verify Documentation Synchronization
        run: |
          make sync-docs
          git diff --exit-code extensions/skills/rad/references/ docs/docs-data.js

      - name: Upload Quality Diagnostics Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rad-quality-diagnostics
          path: |
            tests/radtest/results/
            tests/radtest/build/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Build & Publish Release Distribution
    needs: quality
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Fast Compression Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pigz xz-utils

      - name: Download & Extract Bootstrap Toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.rad /tmp/bootstrap
          (gh release download --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/bootstrap || \
           gh release download 0.2.5 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/bootstrap || \
           gh release download 0.2.4 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/bootstrap || \
           gh release download 0.2.3 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.xz" --dir /tmp/bootstrap) || true
          if [ -d /tmp/bootstrap ] && [ -n "$(ls /tmp/bootstrap/rad-*.tar.xz 2>/dev/null)" ]; then
            ARCHIVE=$(ls /tmp/bootstrap/rad-*.tar.xz | head -n 1)
            tar -xf "$ARCHIVE" -C ~/.rad --strip-components=1 || true
            cp -rf lib/rad "$HOME/.rad/lib/"
            echo "$HOME/.rad/bin" >> $GITHUB_PATH
            if [ -d "$HOME/.rad/lib/llvm" ]; then
              echo "LD_LIBRARY_PATH=$HOME/.rad/lib/llvm:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
            fi
          fi

      - name: Verify Bootstrap Environment
        run: |
          export LD_LIBRARY_PATH="$HOME/.rad/lib/llvm:${LD_LIBRARY_PATH:-}"
          radc --version || true
          rad --version || true
          [ -d ~/.rad/bin ] && ls -la ~/.rad/bin/ || true

      - name: Cache Musl Builder Docker Image
        id: cache-builder
        uses: actions/cache@v4
        with:
          path: /tmp/docker-builder-cache
          key: rad-musl-builder-3.23-${{ hashFiles('tests/docker/builder/Dockerfile') }}

      - name: Load Cached Docker Image or Prepare Cache
        run: |
          mkdir -p /tmp/docker-builder-cache
          if [ -f /tmp/docker-builder-cache/rad-musl-builder.tar.gz ]; then
            echo "==> Restoring cached Docker builder image from compressed archive..."
            pigz -dc /tmp/docker-builder-cache/rad-musl-builder.tar.gz | docker load
            echo "  [✓] Successfully restored rad-musl-builder:3.23 from cache"
          elif [ -f /tmp/docker-builder-cache/rad-musl-builder.tar ]; then
            echo "==> Restoring cached Docker builder image..."
            docker load -i /tmp/docker-builder-cache/rad-musl-builder.tar
            echo "  [✓] Successfully restored rad-musl-builder:3.23 from cache"
          else
            echo "==> Cache miss: Building Docker builder image (rad-musl-builder:3.23)..."
            docker build --network host --platform linux/amd64 -t rad-musl-builder:3.23 tests/docker/builder
            echo "==> Saving Docker builder image for subsequent fast runs..."
            docker save rad-musl-builder:3.23 | pigz -1 > /tmp/docker-builder-cache/rad-musl-builder.tar.gz
          fi

      - name: Build & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--upload --yes)
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          fi
          [ -z "$TAG" ] && TAG="0.2.5"
          ARGS+=(--tag "$TAG")

          TITLE="${{ github.event.inputs.title }}"
          [ -z "$TITLE" ] && TITLE="Rad v0.2.5 — Type Aliases, Function Pointers, Match Expressions, Tuples & Static SQLite"
          ARGS+=(--title "$TITLE")

          NOTES="${{ github.event.inputs.notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Rad v0.2.5: Comprehensive release introducing Type Aliases (type Alias = TargetType;) unlocking core/ffi, First-Class Function Pointers (fn(...) -> Ret) and FP combinators on Option, Result, and Vec, Match Expression Ergonomics and First-Class Tuple Types with pattern destructuring, static vendored SQLite3 engine with zero test skips, pure-Rad package registry CI & integrity validation, and 100% test pass rate across compiler, stdlib, memory safety, and ecosystem suites."
          fi
          ARGS+=(--notes "$NOTES")
          bash scripts/build_distribution.sh "${ARGS[@]}"
