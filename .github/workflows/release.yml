name: Build & Release Toolchain

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Git Tag (default: 0.2.4)'
        required: false
        default: '0.2.4'
      title:
        description: 'Release Title'
        required: false
        default: 'Rad v0.2.4 — TUI Framework, Package Management & Standard Library Expansion'
      notes:
        description: 'Release Notes / Description'
        required: false
        default: 'Rad v0.2.4 Release: Major ecosystem milestone introducing the official Rad Library Registry (rad-lib), pure native RadTUI framework (rad-tui 0.1.0) with differential double-buffering and constraint layouts, RadJSON (rad-json 0.1.0), seamless package management (rad package install/search/info/list/tree/outdated), global ~/.rad/packages/ library resolution (callable directly by name), direct system clang/clang++ interop with zero redundant wrappers, native standard library expansions (path, process, sha256, unicode, deque, hash), and 100% test suite pass rate.'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download & Extract Previous Release (Bootstrap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.rad /tmp/bootstrap
          (gh release download 0.2.4 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download 0.2.3 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download 0.2.2 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download 0.2.1 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download 0.2.0 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download 0.1.0 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap) || true
          if [ -d /tmp/bootstrap ] && [ -n "$(ls /tmp/bootstrap/rad-*.tar.gz 2>/dev/null)" ]; then
            ARCHIVE=$(ls /tmp/bootstrap/rad-*.tar.gz | head -n 1)
            tar -xzf "$ARCHIVE" -C ~/.rad --strip-components=1 || true
            echo "$HOME/.rad/bin" >> $GITHUB_PATH
            if [ -d "$HOME/.rad/lib/llvm" ]; then
              echo "LD_LIBRARY_PATH=$HOME/.rad/lib/llvm:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
            fi
          fi

      - name: Verify Bootstrap Environment
        run: |
          export LD_LIBRARY_PATH="$HOME/.rad/lib/llvm:${LD_LIBRARY_PATH:-}"
          radc --version || true
          rad --version || true
          [ -d ~/.rad/bin ] && ls -la ~/.rad/bin/ || true

      - name: Build & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--upload --yes)
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="0.2.4"
          ARGS+=(--tag "$TAG")

          TITLE="${{ github.event.inputs.title }}"
          [ -z "$TITLE" ] && TITLE="Rad v0.2.4 — TUI Framework, Package Management & Standard Library Expansion"
          ARGS+=(--title "$TITLE")

          NOTES="${{ github.event.inputs.notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Rad v0.2.4 Release: Major ecosystem milestone introducing the official Rad Library Registry (rad-lib), pure native RadTUI framework (rad-tui 0.1.0) with differential double-buffering and constraint layouts, RadJSON (rad-json 0.1.0), seamless package management (rad package install/search/info/list/tree/outdated), global ~/.rad/packages/ library resolution (callable directly by name), direct system clang/clang++ interop with zero redundant wrappers, native standard library expansions (path, process, sha256, unicode, deque, hash), and 100% test suite pass rate."
          fi
          ARGS+=(--notes "$NOTES")
          bash scripts/build_distribution.sh "${ARGS[@]}"
