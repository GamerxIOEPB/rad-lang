name: Build & Release Toolchain

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Git Tag (default: 0.2)'
        required: false
        default: '0.2'
      title:
        description: 'Release Title'
        required: false
        default: 'Rad v0.2.1 - Stabilization, Safety & Language Ergonomics'
      notes:
        description: 'Release Notes / Description'
        required: false
        default: 'Rad v0.2.1 Release: Language ergonomics (range loops, collection loops, array literals, slices, swap, Vec.from), runtime memory safety (bounds checking, division-by-zero traps), explicit statement separators, Rustc-style diagnostics with caret markers, and comprehensive algorithmic test suite.'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write

    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm git github-cli llvm lld clang make tar gzip bash grep coreutils

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download & Extract Previous Release (Bootstrap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.rad /tmp/bootstrap
          gh release download 0.2 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
          gh release download 0.1 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
          gh release download --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap
          ARCHIVE=$(ls /tmp/bootstrap/rad-*.tar.gz | head -n 1)
          tar -xzf "$ARCHIVE" -C ~/.rad --strip-components=1
          echo "$HOME/.rad/bin" >> $GITHUB_PATH
          # Clean up any lingering timestamp tags so only clean version tags exist
          for tag in $(gh release list --repo GamerxIOEPB/rad-lang --json tagName -q '.[].tagName' | grep -E '^v?0\.[0-9]+\.[0-9]+-'); do
            echo "Deleting test tag $tag..."
            gh release delete "$tag" --yes --cleanup-tag --repo GamerxIOEPB/rad-lang || true
          done

      - name: Verify Bootstrap Environment
        run: |
          radc --version || true
          rad --version || true
          ls -la ~/.rad/bin/

      - name: Build & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--upload --yes)
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="0.2"
          ARGS+=(--tag "$TAG")

          TITLE="${{ github.event.inputs.title }}"
          [ -z "$TITLE" ] && TITLE="Rad v0.2.1 - Stabilization, Safety & Language Ergonomics"
          ARGS+=(--title "$TITLE")

          NOTES="${{ github.event.inputs.notes }}"
          if [ -n "$NOTES" ]; then
            ARGS+=(--notes "$NOTES")
          fi
          bash scripts/build_distribution.sh "${ARGS[@]}"
