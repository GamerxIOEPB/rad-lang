name: Build & Release Toolchain

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Git Tag (default: 0.2.3)'
        required: false
        default: '0.2.3'
      title:
        description: 'Release Title'
        required: false
        default: 'Rad v0.2.3 - Compiler Diagnostics, Native Input, Println/Print & Language Server'
      notes:
        description: 'Release Notes / Description'
        required: false
        default: 'Rad v0.2.3 Release: Major developer experience and compiler reliability release. Features native standard input (input() / input(prompt) -> String), distinct print() (no newline, immediate stdout flush) and println() (trailing newline), direct String object printing, modern Rustc-style diagnostics with standardized error codes (E0001–E0030) and unused mutability warnings (W0001), f-string coordinate tracking, native source formatter (rad fmt), stdio JSON-RPC 2.0 Language Server (rad lsp), official Rad Utils VS Code extension (rad-utils-0.2.3.vsix), and 100% pure static-PIE Linux portability across Alpine, Debian, Ubuntu, Arch, and Rocky Linux.'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download & Extract Previous Release (Bootstrap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.rad /tmp/bootstrap
          (gh release download 0.2.3 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download 0.2.2 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download 0.2.1 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download 0.2.0 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download 0.1.0 --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap || \
           gh release download --repo GamerxIOEPB/rad-lang --pattern "rad-*.tar.gz" --dir /tmp/bootstrap) || true
          if [ -d /tmp/bootstrap ] && [ -n "$(ls /tmp/bootstrap/rad-*.tar.gz 2>/dev/null)" ]; then
            ARCHIVE=$(ls /tmp/bootstrap/rad-*.tar.gz | head -n 1)
            tar -xzf "$ARCHIVE" -C ~/.rad --strip-components=1 || true
            echo "$HOME/.rad/bin" >> $GITHUB_PATH
            if [ -d "$HOME/.rad/lib/llvm" ]; then
              echo "LD_LIBRARY_PATH=$HOME/.rad/lib/llvm:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
            fi
          fi

      - name: Verify Bootstrap Environment
        run: |
          export LD_LIBRARY_PATH="$HOME/.rad/lib/llvm:${LD_LIBRARY_PATH:-}"
          radc --version || true
          rad --version || true
          [ -d ~/.rad/bin ] && ls -la ~/.rad/bin/ || true

      - name: Build & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--upload --yes)
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="0.2.3"
          ARGS+=(--tag "$TAG")

          TITLE="${{ github.event.inputs.title }}"
          [ -z "$TITLE" ] && TITLE="Rad v0.2.3 - Compiler Diagnostics, Native Input, Println/Print & Language Server"
          ARGS+=(--title "$TITLE")

          NOTES="${{ github.event.inputs.notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="Rad v0.2.3 Release: Major developer experience and compiler reliability release. Features native standard input (input() / input(prompt) -> String), distinct print() (no newline, immediate stdout flush) and println() (trailing newline), direct String object printing, modern Rustc-style diagnostics with standardized error codes (E0001–E0030) and unused mutability warnings (W0001), f-string coordinate tracking, native source formatter (rad fmt), stdio JSON-RPC 2.0 Language Server (rad lsp), official Rad Utils VS Code extension (rad-utils-0.2.3.vsix), and 100% pure static-PIE Linux portability across Alpine, Debian, Ubuntu, Arch, and Rocky Linux."
          fi
          ARGS+=(--notes "$NOTES")
          bash scripts/build_distribution.sh "${ARGS[@]}"
